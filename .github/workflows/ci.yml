name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test
        if: runner.os != 'Windows'
        run: go test ./... -timeout 20m

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & go test ./... -p 2 -count=1 -json -timeout 20m 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }

          if ($exitCode -ne 0) {
            $failed = $output |
              ForEach-Object {
                try {
                  $_ | ConvertFrom-Json -ErrorAction Stop
                } catch {
                  $null
                }
              } |
              Where-Object { $_.Action -eq "fail" } |
              ForEach-Object {
                if ($_.Test) {
                  "$($_.Package):$($_.Test)"
                } else {
                  $_.Package
                }
              } |
              Sort-Object -Unique
            $details = $failed -join ", "
            Write-Output "::error title=Windows Go test failure::$details"
            exit $exitCode
          }
